
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PigeonClick</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    height:100%; width:100%;
    background:#000;
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color:#fff;
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .screen.show{ display:flex; }

  /* ---------- LOGIN ---------- */
  #login{
    background:radial-gradient(circle at 50% 30%, #1b1f27, #000);
    padding:24px;
  }
  .login-box{
    width:100%; max-width:320px;
    text-align:center;
  }
  .login-box .emoji{ font-size:44px; margin-bottom:6px; }
  .login-box h1{
    font-weight:300; font-size:22px; letter-spacing:.5px; margin-bottom:4px;
  }
  .login-box p{
    font-size:13px; opacity:.55; margin-bottom:22px; font-weight:300;
  }
  #idInput{
    width:100%;
    font-size:26px;
    letter-spacing:6px;
    text-align:center;
    padding:12px 10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:#fff;
    outline:none;
    font-weight:300;
  }
  #idInput::placeholder{ color:rgba(255,255,255,.25); letter-spacing:4px; }
  .errmsg{
    color:#ff8080; font-size:12px; height:16px; margin-top:8px; font-weight:300;
  }
  .primary-btn{
    width:100%;
    margin-top:16px;
    padding:13px;
    border-radius:12px;
    border:none;
    background:#fff;
    color:#000;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  .primary-btn:active{ opacity:.8; }
  .ghost-btn{
    margin-top:12px;
    background:none;
    border:none;
    color:rgba(255,255,255,.5);
    font-size:12px;
    font-weight:300;
    cursor:pointer;
    text-decoration:underline;
  }

  /* ---------- NAME PROMPT ---------- */
  #nameScreen{
    background:radial-gradient(circle at 50% 30%, #1b1f27, #000);
    padding:24px;
  }
  #nameInput{
    width:100%;
    max-width:320px;
    font-size:18px;
    text-align:center;
    padding:12px 10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:#fff;
    outline:none;
    font-weight:300;
    margin-top:20px;
  }
  #nameScreen .login-box{ width:100%; max-width:320px; }

  /* ---------- GAME ---------- */
  #game{ }
  .topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px;
    z-index:5;
    font-size:12px;
    font-weight:300;
  }
  .topbar .player{
    background:rgba(0,0,0,.4);
    padding:5px 10px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .topbar .actions button{
    background:rgba(0,0,0,.4);
    border:none;
    color:#fff;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:300;
    margin-left:6px;
    cursor:pointer;
  }
  .stage{
    position:relative;
    width:100%; height:100%;
    cursor:pointer;
    touch-action:manipulation;
  }
  .stage img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    pointer-events:none;
  }
  .stage img.idle{opacity:1;}
  .stage img.hit{opacity:0;}
  .stage.active img.idle{opacity:0;}
  .stage.active img.hit{opacity:1;}
  .counter{
    position:absolute;
    left:48%;
    top:21%;
    transform:translate(-50%,-50%);
    font-weight:300;
    font-size:clamp(38px, 7vw, 78px);
    color:#fff;
    letter-spacing:-1px;
    line-height:1;
    text-shadow:0 1px 3px rgba(0,0,0,.45), 0 0 24px rgba(0,0,0,.15);
    pointer-events:none;
  }

  /* ---------- LEADERBOARD ---------- */
  #board{
    background:#0b0d11;
    align-items:stretch;
    padding:0;
  }
  .board-header{
    padding:16px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .board-header h2{ font-size:18px; font-weight:400; }
  .board-header button{
    background:rgba(255,255,255,.08);
    border:none; color:#fff; padding:7px 14px; border-radius:999px;
    font-size:12px; cursor:pointer; font-weight:300;
  }
  .board-wrap{
    flex:1; overflow-y:auto; padding:0 18px 18px;
  }
  table{
    width:100%; border-collapse:collapse; font-size:14px;
  }
  thead th{
    text-align:left; font-weight:300; font-size:12px; opacity:.5;
    padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.1);
  }
  tbody td{
    padding:10px 6px; border-bottom:1px solid rgba(255,255,255,.06);
    font-weight:300;
  }
  tbody tr.me{ background:rgba(255,255,255,.06); }
  td.rank{ opacity:.5; width:30px; }
  td.clicks{ text-align:right; font-variant-numeric:tabular-nums; }
  .empty-note{ opacity:.4; font-size:13px; text-align:center; padding:30px 0; font-weight:300; }
</style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="screen show" id="login">
    <div class="login-box">
    
      <h1>PigeonClick</h1>
      <p>กรอกเลขประจำตัวนักเรียน 5 หลักเพื่อเริ่มเล่น</p>
      <input id="idInput" type="tel" inputmode="numeric" maxlength="5" placeholder="00000">
      <div class="errmsg" id="loginErr"></div>
      <button class="primary-btn" id="loginBtn">เข้าเล่น</button>
      <button class="ghost-btn" id="viewBoardBtn">ดูตารางอันดับ</button>
    </div>
  </div>

  <!-- NAME SCREEN -->
  <div class="screen" id="nameScreen">
    <div class="login-box">

      <h1 id="nameTitle">ตั้งชื่อของคุณ</h1>
      <p>เลขประจำตัว <span id="nameForId"></span></p>
      <input id="nameInput" type="text" maxlength="20" placeholder="ชื่อเล่น">
      <div class="errmsg" id="nameErr"></div>
      <button class="primary-btn" id="nameSaveBtn">บันทึกแล้วเล่นเลย</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="game">
    <div class="topbar">
      <div class="player" id="playerLabel"></div>
      <div class="actions">
        <button id="editNameBtn">เปลี่ยนชื่อ</button>
        <button id="boardBtn">อันดับ</button>
        <button id="logoutBtn">ออก</button>
      </div>
    </div>

      <div class="counter" id="counter">0</div>
    </div>
  </div>

  <!-- LEADERBOARD SCREEN -->
  <div class="screen" id="board">
    <div class="board-header">
      <h2>ตารางอันดับ</h2>
      <button id="boardBackBtn">ย้อนกลับ</button>
    </div>
    <div class="board-wrap">
      <table id="boardTable">
        <thead>
          <tr><th class="rank">#</th><th>เลขประจำตัว</th><th>ชื่อ</th><th class="clicks">คะแนน</th></tr>
        </thead>
        <tbody id="boardBody"></tbody>
      </table>
      <div class="empty-note" id="boardEmpty" style="display:none;">ยังไม่มีใครเล่นเลย</div>
    </div>
  </div>

<script>
(function(){
  const screens = {
    login: document.getElementById('login'),
    nameScreen: document.getElementById('nameScreen'),
    game: document.getElementById('game'),
    board: document.getElementById('board'),
  };
  function show(name){
    Object.values(screens).forEach(s => s.classList.remove('show'));
    screens[name].classList.add('show');
  }

  const idInput = document.getElementById('idInput');
  const loginErr = document.getElementById('loginErr');
  const loginBtn = document.getElementById('loginBtn');
  const viewBoardBtn = document.getElementById('viewBoardBtn');

  const nameInput = document.getElementById('nameInput');
  const nameErr = document.getElementById('nameErr');
  const nameSaveBtn = document.getElementById('nameSaveBtn');
  const nameForId = document.getElementById('nameForId');
  const nameTitle = document.getElementById('nameTitle');

  const stage = document.getElementById('stage');
  const counterEl = document.getElementById('counter');
  const playerLabel = document.getElementById('playerLabel');
  const editNameBtn = document.getElementById('editNameBtn');
  const boardBtn = document.getElementById('boardBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  const boardBackBtn = document.getElementById('boardBackBtn');
  const boardBody = document.getElementById('boardBody');
  const boardEmpty = document.getElementById('boardEmpty');

  let currentId = null;
  let currentName = '';
  let clicks = 0;
  let dirty = false;
  let flapTimeout = null;
  let cameFromGame = false;

  idInput.addEventListener('input', () => {
    idInput.value = idInput.value.replace(/\D/g,'').slice(0,5);
  });

  function key(id){ return 'student:' + id; }

  async function loadStudent(id){
    try{
      const res = await window.storage.get(key(id), true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* not found yet */ }
    return null;
  }

  async function saveStudent(rec){
    try{
      await window.storage.set(key(rec.id), JSON.stringify(rec), true);
    }catch(e){ console.error('save error', e); }
  }

  async function listStudents(){
    try{
      const res = await window.storage.list('student:', true);
      if(!res || !res.keys) return [];
      const records = [];
      for(const k of res.keys){
        try{
          const r = await window.storage.get(k, true);
          if(r && r.value) records.push(JSON.parse(r.value));
        }catch(e){}
      }
      return records;
    }catch(e){ return []; }
  }

  async function renderBoard(){
    const records = await listStudents();
    records.sort((a,b) => (b.clicks||0) - (a.clicks||0));
    boardBody.innerHTML = '';
    if(records.length === 0){
      boardEmpty.style.display = 'block';
    }else{
      boardEmpty.style.display = 'none';
      records.forEach((r, i) => {
        const tr = document.createElement('tr');
        if(currentId && r.id === currentId) tr.classList.add('me');
        tr.innerHTML = `<td class="rank">${i+1}</td><td>${r.id}</td><td>${r.name ? escapeHtml(r.name) : '<span style="opacity:.35">ยังไม่ตั้งชื่อ</span>'}</td><td class="clicks">${r.clicks||0}</td>`;
        boardBody.appendChild(tr);
      });
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updatePlayerLabel(){
    playerLabel.textContent = (currentName ? currentName : 'นักเรียน') + ' · ' + currentId;
  }

  loginBtn.addEventListener('click', async () => {
    const id = idInput.value;
    if(!/^\d{5}$/.test(id)){
      loginErr.textContent = 'กรุณากรอกเลข 5 หลัก';
      return;
    }
    loginErr.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'กำลังโหลด...';
    const rec = await loadStudent(id);
    loginBtn.disabled = false;
    loginBtn.textContent = 'เข้าเล่น';
    currentId = id;
    if(rec){
      currentName = rec.name || '';
      clicks = rec.clicks || 0;
      if(!currentName){
        cameFromGame = false;
        nameForId.textContent = id;
        nameTitle.textContent = 'ตั้งชื่อของคุณ';
        nameInput.value = '';
        show('nameScreen');
      }else{
        enterGame();
      }
    }else{
      currentName = '';
      clicks = 0;
      cameFromGame = false;
      nameForId.textContent = id;
      nameTitle.textContent = 'ยินดีต้อนรับ! ตั้งชื่อของคุณ';
      nameInput.value = '';
      show('nameScreen');
    }
  });

  nameSaveBtn.addEventListener('click', async () => {
    const val = nameInput.value.trim();
    if(!val){
      nameErr.textContent = 'กรุณากรอกชื่อ';
      return;
    }
    nameErr.textContent = '';
    currentName = val;
    await saveStudent({ id: currentId, name: currentName, clicks: clicks });
    if(cameFromGame){
      show('game');
      updatePlayerLabel();
    }else{
      enterGame();
    }
  });

  function enterGame(){
    counterEl.textContent = clicks;
    updatePlayerLabel();
    show('game');
  }

  editNameBtn.addEventListener('click', () => {
    cameFromGame = true;
    nameForId.textContent = currentId;
    nameTitle.textContent = 'เปลี่ยนชื่อของคุณ';
    nameInput.value = currentName;
    nameErr.textContent = '';
    show('nameScreen');
  });

  logoutBtn.addEventListener('click', async () => {
    if(dirty){ await flush(); }
    currentId = null; currentName=''; clicks=0;
    idInput.value = '';
    loginErr.textContent = '';
    show('login');
  });

  boardBtn.addEventListener('click', async () => {
    await renderBoard();
    show('board');
  });
  viewBoardBtn.addEventListener('click', async () => {
    await renderBoard();
    show('board');
  });
  boardBackBtn.addEventListener('click', () => {
    show(currentId ? 'game' : 'login');
  });

  // ---- click sound ----
  let audioCtx = null;
  function playPop(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, t);
      osc.frequency.exponentialRampToValueAtTime(220, t + 0.08);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.11);
    }catch(e){}
  }

  async function flush(){
    if(!dirty || !currentId) return;
    dirty = false;
    await saveStudent({ id: currentId, name: currentName, clicks: clicks });
  }
  setInterval(flush, 900);
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); });

  stage.addEventListener('pointerdown', function(e){
    e.preventDefault();
    clicks++;
    dirty = true;
    counterEl.textContent = clicks;
    stage.classList.add('active');
    playPop();
    clearTimeout(flapTimeout);
    flapTimeout = setTimeout(() => stage.classList.remove('active'), 120);
  });

  idInput.focus();
})();
</script>
</body>
</html>
